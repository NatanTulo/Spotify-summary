version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
